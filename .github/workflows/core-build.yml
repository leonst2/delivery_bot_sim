name: delivery_bot_core

on:
  push:
  pull_request:

jobs:
  urdf-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: scripts/check_urdf_sync.sh

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: scripts/check_core_build.sh
