name: delivery_bot_core

# Building and testing the pinned submodule happens in docker.yml (core dev image + sim layer), which runs
# whenever docker/ or the submodule changes. scripts/check_core_build.sh does the same locally.
on:
  push:
  pull_request:

jobs:
  urdf-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: scripts/check_urdf_sync.sh
