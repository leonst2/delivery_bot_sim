# Train:  .venv/bin/mlagents-learn config/delivery_bot_ppo.yaml --run-id=delivery_bot_01
# then press Play in DeliveryBotTraining.unity (or pass --env=<build> --no-graphics for a standalone build).
behaviors:
  DeliveryBot:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 20480
      learning_rate: 3.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    max_steps: 5.0e6
    time_horizon: 128
    summary_freq: 20000
    checkpoint_interval: 500000
    keep_checkpoints: 5

# Curriculum read by TrainingArena: short goals in an empty arena first, then farther goals and more obstacles.
environment_parameters:
  goal_distance:
    curriculum:
      - name: Near
        completion_criteria: {measure: reward, behavior: DeliveryBot, signal_smoothing: true, min_lesson_length: 100, threshold: 0.6}
        value: 4.0
      - name: Mid
        completion_criteria: {measure: reward, behavior: DeliveryBot, signal_smoothing: true, min_lesson_length: 100, threshold: 0.6}
        value: 8.0
      - name: Far
        value: 15.0
  obstacle_count:
    curriculum:
      - name: Empty
        completion_criteria: {measure: reward, behavior: DeliveryBot, signal_smoothing: true, min_lesson_length: 100, threshold: 0.6}
        value: 0
      - name: Some
        completion_criteria: {measure: reward, behavior: DeliveryBot, signal_smoothing: true, min_lesson_length: 100, threshold: 0.6}
        value: 5
      - name: Many
        value: 12
